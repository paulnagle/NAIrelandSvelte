name: iOS TestFlight

# Manual/tag-triggered on purpose: macOS runner minutes bill at a 10x multiplier
# against the Actions quota, and an upload creates a permanent build record —
# build numbers cannot be reused, and builds can be expired but never deleted.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to TestFlight (uncheck to archive only)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # Must carry Xcode 26+/iOS 26 SDK: App Store Connect rejects uploads built
    # against anything older with a 409 at the altool stage — after a full
    # successful archive and export, so the failure surfaces late and expensively.
    runs-on: macos-26
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ie.nasouth.apple
      SCHEME: App
      XCODE_PROJECT: ios/App/App.xcodeproj

    steps:
      - uses: actions/checkout@v7

      # Checked before anything expensive runs: a missing secret otherwise
      # surfaces as an opaque codesign failure ten minutes into the job.
      - name: Verify secrets
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
          [ -n "${{ secrets.APPSTORE_KEY_ID }}" ] || missing+=("APPSTORE_KEY_ID")
          [ -n "${{ secrets.APPSTORE_ISSUER_ID }}" ] || missing+=("APPSTORE_ISSUER_ID")
          [ -n "${{ secrets.APPSTORE_PRIVATE_KEY }}" ] || missing+=("APPSTORE_PRIVATE_KEY")
          [ -n "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" ] || missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -n "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ] || missing+=("IOS_DIST_CERT_PASSWORD")
          [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] || missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      # Fail fast and loudly if the runner image ever drifts back below the SDK
      # floor Apple enforces, rather than burning a full build to find out.
      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $SDK_VERSION is below the iOS 26 minimum App Store Connect requires."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The map screen needs the key baked in at build time; everything else
      # works without it, so an absent secret degrades rather than fails.
      - name: Build web bundle
        env:
          PUBLIC_GOOGLE_MAPS_KEY_WEB: ${{ secrets.GOOGLE_MAPS_KEY_WEB }}
          PUBLIC_GOOGLE_MAPS_KEY_IOS: ${{ secrets.GOOGLE_MAPS_KEY_IOS }}
          PUBLIC_GOOGLE_MAPS_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_KEY_ANDROID }}
          PUBLIC_GOOGLE_MAPS_ANDROID_CERT_SHA1: ${{ secrets.GOOGLE_MAPS_ANDROID_CERT_SHA1 }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # Signing assets live only for the life of this job, in a throwaway
      # keychain. Only the Apple Distribution certificate is needed — manual
      # signing resolves the identity from the provisioning profile type, so
      # there is no reason to carry a development certificate here.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dist.p12"

          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # Without this, codesign blocks on a GUI keychain-access prompt that
          # nothing on a headless runner can answer, and the job hangs.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # The provisioning profile is installed into the runner's profile library
      # so Xcode's manual signing can find it by UUID. No Apple ID portal session
      # is needed — Xcode reads the profile directly from disk.
      # The UUID is extracted from the profile itself (it is embedded as a plist
      # inside the CMS envelope) so it does not need to be stored as a separate
      # secret or hardcoded anywhere.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/dist.mobileprovision"
          PLIST_PATH="$RUNNER_TEMP/profile.plist"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          # Strip the CMS envelope to get a plain plist. openssl is more
          # reliable than `security cms -D` on recent macOS runner images.
          openssl smime -inform der -verify -noverify \
            -in "$PROFILE_PATH" -out "$PLIST_PATH" 2>/dev/null
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_PATH")"
          rm -f "$PLIST_PATH"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed profile $PROFILE_UUID"
          rm -f "$PROFILE_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # xcodebuild -exportArchive takes an explicit -authenticationKeyPath.
          # Keep a copy in ~/.appstoreconnect/private_keys as well in case any
          # Xcode tooling falls back to the well-known search path.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Manual signing is used instead of -allowProvisioningUpdates with
      # CODE_SIGN_STYLE=Automatic. Automatic signing on a headless runner requires
      # Xcode to resolve the team's certificates via the legacy Apple ID portal
      # session endpoint (listTeams.action). Without an interactive Apple ID
      # session that call returns 401 and the archive fails with "No profiles
      # found". The App Store Connect API key covers upload but not provisioning.
      #
      # With manual signing, Xcode reads the profile from disk (installed above)
      # and resolves the identity from the keychain — no portal round-trip needed.
      #
      # CODE_SIGN_IDENTITY must NOT appear on this command line. xcodebuild
      # applies command-line settings to every target in the graph, including SPM
      # packages, which then fail with their own provisioning conflicts. The
      # identity is resolved implicitly from the certificate type in the profile.
      #
      # MARKETING_VERSION is what TestFlight shows as the version; without it a
      # tagged build inherits whatever is committed in the Xcode project, so
      # every release reads 1.0. A manual run leaves the project value alone —
      # only a tag names a version.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "marketing=MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "Version ${GITHUB_REF_NAME#v} (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "marketing=" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${{ steps.version.outputs.marketing }}

      # ExportOptions.plist ships without a teamID or provisioningProfiles entry
      # so this public repository carries no Apple account identifiers. Both are
      # injected here. The provisioningProfiles map (bundle-id → profile UUID)
      # tells xcodebuild -exportArchive which on-disk profile to use so that it
      # never needs to contact the portal — the legacy listTeams.action endpoint
      # returns 401 on headless runners and causes "requires a provisioning profile".
      - name: Set export options
        run: |
          set -euo pipefail
          test -n "$TEAM_ID"       || { echo "::error::APPLE_TEAM_ID secret is not set"; exit 1; }
          test -n "$PROFILE_UUID"  || { echo "::error::PROFILE_UUID not set (Install provisioning profile step failed?)"; exit 1; }
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ios/App/ExportOptions.plist
          # provisioningProfiles is a dict: bundle-id → profile name or UUID.
          # Using the UUID is unambiguous; the profile is already on disk by this point.
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ios/App/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" ios/App/ExportOptions.plist

      # Export the IPA from the archive. This always runs — the IPA is needed
      # for the artifact step regardless of whether we upload.
      # altool is not used: it fails with 401 on headless runners regardless of
      # flag spelling. Instead, when uploading we patch destination=upload into
      # ExportOptions.plist and run a second -exportArchive call (re-exporting
      # from the same .xcarchive is fast — no recompile). xcodebuild uses the
      # same -authenticationKey* path already proven to work in this job.
      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          test -n "$IPA" || { echo "::error::No .ipa found in $RUNNER_TEMP/export"; exit 1; }
          # --upload-app does a lookupGenericSettingsForSubmission pre-flight that
          # always returns Unauthenticated on headless runners. --upload-package
          # skips that lookup and goes straight to the binary upload endpoint,
          # using the same API key credentials.
          xcrun altool --upload-package "$IPA" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/App.xcarchive/**/*.dSYM
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/AuthKey.p8" || true
