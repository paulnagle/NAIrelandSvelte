name: Android build and Play upload

# Manual or tag-triggered, matching the iOS workflow. Ubuntu runners are cheap
# (no 10x macOS multiplier), so this could run on every push — it does not,
# because a build worth installing should be a deliberate act, and `ci.yml`
# already proves the web bundle compiles on every push.
on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload the signed AAB to Google Play open testing'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # AGP 8.13 requires JDK 17+; 21 is the current LTS and what the project
      # builds against locally.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      # A tag push sets the shipped version and a Play-safe versionCode derived
      # from semver. Manual runs stay clearly non-release and use a high fallback
      # code above the current production floor.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<EOF
          $NAME
          EOF
            CODE=$(printf '%d%02d%02d001' "$MAJOR" "$MINOR" "$PATCH")
          else
            NAME="0.0.0-dev"
            CODE="801000001"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code $CODE)" >> "$GITHUB_STEP_SUMMARY"

      # The Maps keys are inlined into the web bundle at build time. All three
      # are passed even when empty; an unset key degrades to an empty string.
      - name: Build web bundle
        env:
          PUBLIC_GOOGLE_MAPS_KEY_WEB: ${{ secrets.GOOGLE_MAPS_KEY_WEB }}
          PUBLIC_GOOGLE_MAPS_KEY_IOS: ${{ secrets.GOOGLE_MAPS_KEY_IOS }}
          PUBLIC_GOOGLE_MAPS_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_KEY_ANDROID }}
          PUBLIC_GOOGLE_MAPS_ANDROID_CERT_SHA1: ${{ secrets.GOOGLE_MAPS_ANDROID_CERT_SHA1 }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Written outside the workspace so it cannot be picked up by a later step
      # or swept into an artifact, and deleted in an always() step at the end.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo -n "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      # Two artifacts on purpose: the APK is what you sideload to test, the AAB
      # is the only format Play accepts for a new app.
      #
      # GOOGLE_MAPS_KEY_ANDROID is passed to Gradle separately from the web
      # bundle's keys because the Maps SDK for Android reads its key from the
      # merged manifest, not from the apiKey handed to GoogleMap.create(). That
      # key is restricted to this package *and* this keystore's SHA-1, so
      # anything signed with a different key shows a blank map — which is why the
      # AAB needs care: see the Play App Signing note in the README.
      - name: Assemble release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_KEY_ANDROID }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      # An unsigned APK still builds and would upload happily, then fail to
      # install with no useful message. Fail here instead, and record which
      # certificate signed it so a blank map can be traced back to a SHA-1 that
      # is not on the Maps key.
      - name: Verify signature
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: bmlt-search-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play open testing
        if: github.event_name == 'push' || inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ie.nasouth.android.naireland
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: beta
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
